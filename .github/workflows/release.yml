name: release
# Pushing a tag like v1.2.0 builds the binaries with scripts/build.sh and
# publishes them, with SHA-256 checksums, on the tag's GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - run: bash scripts/build.sh
      - name: Checksums
        working-directory: dist/tordo
        run: sha256sum tordo-* > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse a release drafted by hand for this tag; otherwise create one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tordo/* --clobber
          else
            gh release create "$TAG" dist/tordo/* --title "Tordo $TAG" --generate-notes --verify-tag
          fi
